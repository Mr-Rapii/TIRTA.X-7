<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kas Kelas X-7 · Gugus Tirta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070a; --card:rgba(255,255,255,0.03); --border:rgba(255,255,255,0.1);
    --emerald:#34d399; --emerald-soft:rgba(52,211,153,0.15); --emerald-border:rgba(52,211,153,0.4);
    --amber:#fbbf24; --amber-soft:rgba(251,191,36,0.15); --amber-border:rgba(251,191,36,0.4);
    --red:#f87171; --text:#e5e5e5; --muted:#a3a3a3; --faint:#525252;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .bg-grid{position:fixed;inset:0;opacity:.05;background-image:linear-gradient(var(--emerald) 1px,transparent 1px),linear-gradient(90deg,var(--emerald) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;}
  .glow-a{position:fixed;top:-160px;right:-160px;width:384px;height:384px;border-radius:50%;background:rgba(52,211,153,0.1);filter:blur(80px);pointer-events:none;}
  .glow-b{position:fixed;bottom:-160px;left:-160px;width:384px;height:384px;border-radius:50%;background:rgba(251,191,36,0.1);filter:blur(80px);pointer-events:none;}
  .wrap{position:relative;max-width:1100px;margin:0 auto;padding:32px 20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(6px);}
  .btn{cursor:pointer;border-radius:10px;font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--text);padding:8px 14px;transition:.15s;}
  .btn:hover{border-color:rgba(255,255,255,0.3);}
  .btn-emerald{background:var(--emerald-soft);border-color:var(--emerald-border);color:var(--emerald);}
  .btn-amber{background:var(--amber-soft);border-color:var(--amber-border);color:var(--amber);}
  input,button{font-family:inherit;}
  input[type=text],input[type=password],input[type=number],input[type=date]{
    width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;
    padding:9px 12px;color:var(--text);outline:none;font-size:14px;
  }
  input:focus{border-color:var(--emerald-border);}
  label.lbl{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:4px;}
  .tab-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.03em;border:none;background:none;color:var(--faint);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;}
  .tab-btn.active{color:var(--emerald);border-color:var(--emerald);}
  .row{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.05);}
  .row:last-child{border-bottom:none;}
  .row:hover{background:rgba(255,255,255,0.02);}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:11px;border:1px solid;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal-box{background:#0a0e14;border-radius:16px;padding:24px;width:100%;max-width:380px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;border:1px solid var(--emerald-border);color:var(--emerald);font-family:'JetBrains Mono',monospace;font-size:12px;padding:10px 18px;border-radius:10px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#222;border-radius:8px;}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow-a"></div>
<div class="glow-b"></div>
<div id="root" class="wrap"></div>

<script>
const STUDENTS = [
  "Agas Maulana Ramdhani","Akhdan Arif Athaya","Aliffa Aurelia Soekanto","Alya Safrida",
  "Alzena Evelyn Purnama","Anindia Zilvana Putri","Annisa Ratna Putri Sumaryana","Arfa Siena Nurakhman",
  "Ariq Putra Miftah","Cinta Giesancya Ramadhani Permana","Darren Marcello Halomoan Gurning","Defan Rezky Ramadhan",
  "Della Nur Azzijah","Devara Narawata Yusup","Fachriza Hanif Rasib","Farha Ainun Ainiyyah",
  "Farrel Setya Ramadhan","Habib Akbar Lukmansyah","Haidar Adnan Haryono","Jeremy Lyonel Agustinus Sitompul",
  "Josefhine Nathaniel","Kanichi Alifianisa","Kennisa Saifana","Keyla Taufika Hidayani",
  "Khaerul Fahad Abdulilah","Marva Gavrila Putri Hendrayana","Meisya Herawati","Mira Pebriani",
  "Muhamad Ariel Zani","Muhammad Faisal Febriyan","Muhammad Zulkarnaen","Najwan Fauzi Hidayat",
  "Nayla Mazaaya Althafunnisa","Neta Triwahyuni Putri","Nur' Malasari","Nuri Zalianty",
  "Raffi Ramadhan","Rinjani Lalita Purnamasari","Rismayanti","Sabian Arrangga Hidayat",
  "Sakya Jihan Nafeeza","Salsa Nabila Aliyanti","Shaomy Aquila Purnawarman","Sofi Sulistiyawati",
  "Zameyra Riskia Khalisya","Zeima Zahran"
];

const WEEK_AMOUNT = 5000;
const DATA_KEY = "kasX7Data";
const BACKUP_KEY = "kasX7DataBackup";
const PW_KEY = "kasX7PwHash";
const DAYS = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function formatID(dateStr){
  if(!dateStr) return "-";
  const d = new Date(dateStr+"T00:00:00");
  if(isNaN(d)) return dateStr;
  return DAYS[d.getDay()]+", "+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
}
function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime()-off*60000).toISOString().slice(0,10);
}
function rupiah(n){ return "Rp"+n.toLocaleString("id-ID"); }
function simpleHash(str){
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){
    const ch=str.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761);
    h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function defaultData(){
  return { weeks:[{id:"w-"+Date.now(), label:"Minggu 1", date:todayISO()}], payments:{}, expenses:[] };
}

let state = {
  data: null,
  tab: "mingguan",
  activeWeek: null,
  expanded: null,
  ownerUnlocked: false,
  showSetup: false,
  showLogin: false,
  showChangePw: false,
};
let toastTimer = null;

function loadData(){
  try{
    const raw = localStorage.getItem(DATA_KEY);
    return raw ? JSON.parse(raw) : defaultData();
  }catch(e){ return defaultData(); }
}
function saveData(d){
  state.data = d;
  try{
    localStorage.setItem(DATA_KEY, JSON.stringify(d));
    localStorage.setItem(BACKUP_KEY, JSON.stringify(Object.assign({savedAt:new Date().toISOString()}, d)));
  }catch(e){ showToast("Gagal menyimpan data (memori penuh?)."); }
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display="none"; }, 2400);
}
function requireOwner(fn){
  if(!state.ownerUnlocked){ showToast("Masuk sebagai pemilik kas dulu untuk edit."); state.showLogin = true; render(); return; }
  fn();
}

// ---------- actions ----------
function setTab(t){ state.tab = t; state.expanded = null; render(); }
function selectWeek(id){ state.activeWeek = id; render(); }
function toggleExpand(idx){ state.expanded = state.expanded===idx ? null : idx; render(); }

function addWeek(){
  requireOwner(()=>{
    const w = { id:"w-"+Date.now(), label:"Minggu "+(state.data.weeks.length+1), date: todayISO() };
    const next = Object.assign({}, state.data, { weeks:[...state.data.weeks, w] });
    saveData(next); state.activeWeek = w.id; showToast(w.label+" ditambahkan"); render();
  });
}
function deleteWeek(weekId){
  requireOwner(()=>{
    if(state.data.weeks.length<=1){ showToast("Minimal harus ada 1 minggu."); return; }
    const weeks = state.data.weeks.filter(w=>w.id!==weekId);
    const payments = {};
    Object.keys(state.data.payments).forEach(sIdx=>{
      const wp = Object.assign({}, state.data.payments[sIdx]);
      delete wp[weekId];
      payments[sIdx]=wp;
    });
    const next = Object.assign({}, state.data, {weeks, payments});
    saveData(next);
    if(state.activeWeek===weekId) state.activeWeek = weeks[weeks.length-1]?.id;
    render();
  });
}
function togglePayment(studentIdx, weekId){
  requireOwner(()=>{
    const cur = state.data.payments[studentIdx]?.[weekId];
    const isPaid = cur?.paid;
    const payments = Object.assign({}, state.data.payments);
    payments[studentIdx] = Object.assign({}, payments[studentIdx]);
    payments[studentIdx][weekId] = isPaid ? null : {paid:true, date: todayISO()};
    saveData(Object.assign({}, state.data, {payments}));
    render();
  });
}
function addExpense(){
  requireOwner(()=>{
    const item = document.getElementById("expItem").value.trim();
    const amount = parseInt(document.getElementById("expAmount").value, 10);
    const note = document.getElementById("expNote").value.trim();
    const date = document.getElementById("expDate").value || todayISO();
    if(!item || !amount || amount<=0){ showToast("Isi nama barang dan jumlah dengan benar."); return; }
    const exp = {id:"e-"+Date.now(), item, amount, note, date};
    const next = Object.assign({}, state.data, {expenses:[exp, ...state.data.expenses]});
    saveData(next);
    showToast("Pengeluaran dicatat.");
    render();
  });
}
function deleteExpense(id){
  requireOwner(()=>{
    const next = Object.assign({}, state.data, {expenses: state.data.expenses.filter(e=>e.id!==id)});
    saveData(next); render();
  });
}
function exportBackup(){
  requireOwner(()=>{
    const blob = new Blob([JSON.stringify(state.data,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "kas-x7-backup-"+todayISO()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast("File backup diunduh.");
  });
}
function importBackupFile(input){
  requireOwner(()=>{
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.weeks || !parsed.payments) throw new Error("format tidak valid");
        const next = {weeks:parsed.weeks, payments:parsed.payments, expenses:parsed.expenses||[]};
        saveData(next);
        state.activeWeek = next.weeks[next.weeks.length-1]?.id;
        showToast("Data berhasil dipulihkan dari file backup.");
      }catch(e){ showToast("File backup tidak valid."); }
      render();
    };
    reader.readAsText(file);
    input.value = "";
  });
}
function restoreLocalBackup(){
  requireOwner(()=>{
    try{
      const raw = localStorage.getItem(BACKUP_KEY);
      if(!raw){ showToast("Belum ada cadangan tersimpan."); return; }
      const parsed = JSON.parse(raw);
      const next = {weeks:parsed.weeks, payments:parsed.payments, expenses:parsed.expenses||[]};
      saveData(next);
      state.activeWeek = next.weeks[next.weeks.length-1]?.id;
      showToast("Data dipulihkan dari cadangan otomatis terakhir.");
    }catch(e){ showToast("Gagal memulihkan cadangan."); }
    render();
  });
}

// auth
function completeSetup(){
  const p1 = document.getElementById("setupPw1").value;
  const p2 = document.getElementById("setupPw2").value;
  if(p1.length<4){ showToast("Password minimal 4 karakter."); return; }
  if(p1!==p2){ showToast("Konfirmasi password tidak cocok."); return; }
  localStorage.setItem(PW_KEY, simpleHash(p1));
  state.ownerUnlocked = true; state.showSetup = false;
  showToast("Password pemilik berhasil dibuat. Kamu masuk sebagai pemilik.");
  render();
}
function attemptLogin(){
  const p = document.getElementById("loginPw").value;
  const hash = localStorage.getItem(PW_KEY);
  if(simpleHash(p)===hash){
    state.ownerUnlocked = true; state.showLogin = false;
    showToast("Berhasil masuk sebagai pemilik kas.");
  } else { showToast("Password salah."); }
  render();
}
function lockOwner(){ state.ownerUnlocked = false; render(); }
function completeChangePw(){
  const p1 = document.getElementById("changePw1").value;
  const p2 = document.getElementById("changePw2").value;
  if(p1.length<4){ showToast("Password minimal 4 karakter."); return; }
  if(p1!==p2){ showToast("Konfirmasi password tidak cocok."); return; }
  localStorage.setItem(PW_KEY, simpleHash(p1));
  state.showChangePw = false;
  showToast("Password berhasil diganti.");
  render();
}
function filterStudents(query){
  const q = query.toLowerCase();
  document.querySelectorAll("[data-student-row]").forEach(el=>{
    const name = el.getAttribute("data-name");
    el.style.display = name.includes(q) ? "" : "none";
  });
}

// ---------- render ----------
function computeTotals(){
  let totalMasuk = 0;
  state.data.weeks.forEach(w=>{
    STUDENTS.forEach((_,i)=>{ if(state.data.payments[i]?.[w.id]?.paid) totalMasuk += WEEK_AMOUNT; });
  });
  const totalKeluar = state.data.expenses.reduce((s,e)=>s+e.amount,0);
  return { totalMasuk, totalKeluar, saldo: totalMasuk-totalKeluar };
}

function render(){
  const d = state.data;
  const { totalMasuk, totalKeluar, saldo } = computeTotals();
  const week = d.weeks.find(w=>w.id===state.activeWeek);
  const paidCount = week ? STUDENTS.filter((_,i)=>d.payments[i]?.[week.id]?.paid).length : 0;

  let html = "";
  html += `<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:32px;">
    <div>
      <div class="mono" style="font-size:11px;letter-spacing:.25em;color:rgba(251,191,36,.8);text-transform:uppercase;margin-bottom:4px;">Kelas X-7 &middot; Gugus Tirta</div>
      <h1 style="font-size:32px;font-weight:700;margin:0;">Kas Kelas</h1>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="mono" style="font-size:12px;color:var(--muted);">iuran: ${rupiah(WEEK_AMOUNT)}/minggu</div>
      ${ state.ownerUnlocked ?
        `<span class="badge" style="background:var(--emerald-soft);border-color:var(--emerald-border);color:var(--emerald);">&#128275;&#65039; Pemilik</span>
         <button class="btn" onclick="state.showChangePw=true;render()" title="Ganti password">&#128273;</button>
         <button class="btn" style="color:var(--red);" onclick="lockOwner()">Keluar</button>`
        :
        `<button class="btn" onclick="state.showLogin=true;render()">&#128274; Masuk sebagai Pemilik</button>`
      }
    </div>
  </div>`;

  html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:32px;">
    <div class="card" style="padding:20px;border-color:rgba(52,211,153,.2);">
      <div class="mono" style="font-size:11px;text-transform:uppercase;color:var(--emerald);margin-bottom:8px;">&#128200; Total Pemasukan</div>
      <div style="font-size:22px;font-weight:600;">${rupiah(totalMasuk)}</div>
    </div>
    <div class="card" style="padding:20px;border-color:rgba(251,191,36,.2);">
      <div class="mono" style="font-size:11px;text-transform:uppercase;color:var(--amber);margin-bottom:8px;">&#128201; Total Pengeluaran</div>
      <div style="font-size:22px;font-weight:600;">${rupiah(totalKeluar)}</div>
    </div>
    <div class="card" style="padding:20px;background:linear-gradient(135deg,rgba(52,211,153,.1),rgba(251,191,36,.1));">
      <div class="mono" style="font-size:11px;text-transform:uppercase;color:var(--text);margin-bottom:8px;">&#128176; Saldo Kas Tersedia</div>
      <div style="font-size:22px;font-weight:600;">${rupiah(saldo)}</div>
    </div>
  </div>`;

  html += `<div style="display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:24px;overflow-x:auto;">
    ${tabBtn("mingguan","&#128101; Rekap Mingguan")}
    ${tabBtn("siswa","&#128269; Per Siswa")}
    ${tabBtn("pengeluaran","&#128722; Kas &amp; Pengeluaran")}
    ${tabBtn("backup","&#11015;&#65039; Backup Data")}
  </div>`;

  if(state.tab==="mingguan") html += renderMingguan(week, paidCount);
  else if(state.tab==="siswa") html += renderSiswa();
  else if(state.tab==="pengeluaran") html += renderPengeluaran(saldo);
  else if(state.tab==="backup") html += renderBackup();

  html += `<div style="margin-top:40px;text-align:center;" class="mono" style="font-size:10px;color:var(--faint);letter-spacing:.05em;">semua orang bisa lihat data kas ini, tapi hanya pemilik yang bisa edit</div>`;

  // modals
  if(state.showSetup) html += modalSetup();
  if(state.showLogin) html += modalLogin();
  if(state.showChangePw) html += modalChangePw();

  document.getElementById("root").innerHTML = html;

  if(state.tab==="siswa"){
    const inp = document.getElementById("searchInput");
    if(inp) inp.focus();
  }
}

function tabBtn(id,label){
  return `<button class="tab-btn ${state.tab===id?'active':''}" onclick="setTab('${id}')">${label}</button>`;
}

function renderMingguan(week, paidCount){
  let html = `<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:20px;">`;
  state.data.weeks.forEach(w=>{
    const active = w.id===state.activeWeek;
    html += `<button class="btn mono" style="${active?'background:var(--emerald-soft);border-color:var(--emerald-border);color:var(--emerald);':''}" onclick="selectWeek('${w.id}')">${w.label}</button>`;
  });
  html += `<button class="btn mono" style="border-style:dashed;color:var(--amber);border-color:var(--amber-border);" onclick="addWeek()">&#128197;&#43; Tambah Minggu</button></div>`;

  if(!week) return html;
  const unpaidCount = 46 - paidCount;
  html += `<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;">
    <div>
      <div style="font-size:18px;font-weight:600;">${week.label}</div>
      <div class="mono" style="font-size:12px;color:var(--muted);">${formatID(week.date)}</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span class="mono" style="font-size:12px;color:var(--emerald);">Lunas: ${paidCount}/46</span>
      <span class="mono" style="font-size:12px;color:var(--amber);">Belum: ${unpaidCount}/46</span>
      ${state.data.weeks.length>1 ? `<button class="btn" style="color:var(--red);border:none;background:none;" onclick="deleteWeek('${week.id}')" title="Hapus minggu ini">&#128465;&#65039;</button>` : ''}
    </div>
  </div>`;

  html += `<div class="card" style="overflow:hidden;">`;
  STUDENTS.forEach((name, idx)=>{
    const rec = state.data.payments[idx]?.[week.id];
    const paid = rec?.paid;
    html += `<div class="row">
      <div style="display:flex;align-items:center;gap:12px;min-width:0;">
        <span class="mono" style="font-size:11px;color:var(--faint);width:22px;flex-shrink:0;">${idx+1}</span>
        <span style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${name}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
        ${paid ? `<span class="mono" style="font-size:11px;color:var(--muted);" class="hide-mobile">${formatID(rec.date)}</span>` : ''}
        <button class="btn mono" style="${paid ? 'background:var(--emerald-soft);border-color:var(--emerald-border);color:var(--emerald);' : 'background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:var(--red);'}${!state.ownerUnlocked?'opacity:.6;':''}" onclick="togglePayment(${idx},'${week.id}')">
          ${paid ? '&#10003; Lunas' : '&#10007; Belum'}
        </button>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderSiswa(){
  let html = `<div style="position:relative;margin-bottom:20px;">
    <input id="searchInput" type="text" placeholder="Cari nama siswa..." oninput="filterStudents(this.value)" style="padding-left:14px;">
  </div><div style="display:flex;flex-direction:column;gap:8px;">`;

  STUDENTS.forEach((name, idx)=>{
    const paidWeeks = state.data.weeks.filter(w=>state.data.payments[idx]?.[w.id]?.paid);
    const unpaidWeeks = state.data.weeks.filter(w=>!state.data.payments[idx]?.[w.id]?.paid);
    const isOpen = state.expanded===idx;
    html += `<div class="card" data-student-row data-name="${name.toLowerCase()}" style="overflow:hidden;">
      <button onclick="toggleExpand(${idx})" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:none;border:none;color:inherit;cursor:pointer;text-align:left;">
        <div style="display:flex;align-items:center;gap:12px;min-width:0;">
          <span class="mono" style="font-size:11px;color:var(--faint);width:22px;flex-shrink:0;">${idx+1}</span>
          <span style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${name}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
          <span class="mono" style="font-size:11px;color:var(--emerald);">${paidWeeks.length} lunas</span>
          <span class="mono" style="font-size:11px;color:var(--amber);">${unpaidWeeks.length} belum</span>
          <span style="color:var(--faint);">${isOpen?'&#9650;':'&#9660;'}</span>
        </div>
      </button>`;
    if(isOpen){
      html += `<div style="padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;border-top:1px solid rgba(255,255,255,.05);padding-top:12px;">
        <div>
          <div class="mono" style="font-size:11px;text-transform:uppercase;color:var(--emerald);margin-bottom:8px;">Sudah Bayar</div>
          ${paidWeeks.length===0 ? `<div style="font-size:12px;color:var(--faint);">- belum ada -</div>` :
            `<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;">` +
            paidWeeks.map(w=>`<li style="font-size:12px;display:flex;justify-content:space-between;gap:8px;"><span>${w.label}</span><span class="mono" style="color:var(--muted);">${formatID(state.data.payments[idx][w.id].date)}</span></li>`).join("") +
            `</ul>`}
        </div>
        <div>
          <div class="mono" style="font-size:11px;text-transform:uppercase;color:var(--amber);margin-bottom:8px;">Belum Bayar</div>
          ${unpaidWeeks.length===0 ? `<div style="font-size:12px;color:var(--faint);">- lunas semua -</div>` :
            `<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;">` +
            unpaidWeeks.map(w=>`<li style="font-size:12px;display:flex;justify-content:space-between;gap:8px;"><span>${w.label}</span><span class="mono" style="color:var(--muted);">${formatID(w.date)}</span></li>`).join("") +
            `</ul>`}
        </div>
      </div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function renderPengeluaran(saldo){
  let html = `<div style="display:grid;grid-template-columns:1fr;gap:24px;">`;
  html += `<div>
    <div style="font-size:14px;font-weight:600;margin-bottom:12px;">Catat Pengeluaran Baru</div>
    ${!state.ownerUnlocked ? `<div class="mono" style="font-size:12px;color:var(--amber);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:10px;padding:8px 12px;margin-bottom:12px;">Masuk sebagai pemilik kas untuk menambah pengeluaran.</div>` : ''}
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px;">
      <div><label class="lbl">Nama Barang / Keperluan</label><input id="expItem" type="text" placeholder="mis. Spidol &amp; penghapus papan tulis"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div><label class="lbl">Jumlah (Rp)</label><input id="expAmount" type="number" placeholder="0"></div>
        <div><label class="lbl">Tanggal</label><input id="expDate" type="date" value="${todayISO()}"></div>
      </div>
      <div><label class="lbl">Catatan (opsional)</label><input id="expNote" type="text" placeholder="mis. dibeli di toko ATK dekat sekolah"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="mono" style="font-size:11px;color:var(--muted);">Saldo saat ini: ${rupiah(saldo)}</span>
        <button class="btn btn-amber" onclick="addExpense()">&#43; Catat</button>
      </div>
    </div>
  </div>`;

  html += `<div>
    <div style="font-size:14px;font-weight:600;margin-bottom:12px;">Riwayat Pengeluaran</div>
    <div class="card" style="max-height:420px;overflow-y:auto;">`;
  if(state.data.expenses.length===0){
    html += `<div style="padding:16px;font-size:12px;color:var(--faint);">Belum ada pengeluaran tercatat.</div>`;
  }
  state.data.expenses.forEach(e=>{
    html += `<div class="row" style="align-items:flex-start;">
      <div style="min-width:0;">
        <div style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.item}</div>
        ${e.note ? `<div style="font-size:12px;color:var(--muted);">${e.note}</div>` : ''}
        <div class="mono" style="font-size:11px;color:var(--faint);margin-top:2px;">${formatID(e.date)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <span class="mono" style="font-size:14px;color:var(--amber);">-${rupiah(e.amount)}</span>
        <button onclick="deleteExpense('${e.id}')" style="background:none;border:none;color:var(--faint);cursor:pointer;">&#128465;&#65039;</button>
      </div>
    </div>`;
  });
  html += `</div></div></div>`;
  return html;
}

function renderBackup(){
  return `<div style="max-width:520px;">
    <div style="font-size:14px;font-weight:600;margin-bottom:4px;">Backup &amp; Pemulihan Data</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:20px;">Data disimpan di browser (localStorage) HP/PC ini. Kalau cache browser dibersihkan atau ganti perangkat, data bisa hilang &mdash; jadi rutin unduh file backup ke perangkatmu untuk jaga-jaga.</p>
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div class="card" style="padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div><div style="font-size:14px;">Unduh Backup ke File</div><div class="mono" style="font-size:11px;color:var(--muted);">Simpan file .json ke HP/Drive kamu</div></div>
        <button class="btn btn-emerald" onclick="exportBackup()">&#11015;&#65039; Unduh</button>
      </div>
      <div class="card" style="padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div><div style="font-size:14px;">Pulihkan dari File</div><div class="mono" style="font-size:11px;color:var(--muted);">Upload file .json backup yang pernah diunduh</div></div>
        <label class="btn" style="cursor:pointer;">&#11014;&#65039; Pilih File<input type="file" accept="application/json" style="display:none;" onchange="importBackupFile(this)"></label>
      </div>
      <div class="card" style="padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div><div style="font-size:14px;">Pulihkan Cadangan Otomatis</div><div class="mono" style="font-size:11px;color:var(--muted);">Kalau data utama di browser ini tiba-tiba kosong</div></div>
        <button class="btn" onclick="restoreLocalBackup()">&#8635; Pulihkan</button>
      </div>
    </div>
  </div>`;
}

function modalSetup(){
  return `<div class="modal-overlay"><div class="modal-box" style="border:1px solid rgba(52,211,153,.3);">
    <div style="display:flex;align-items:center;gap:8px;color:var(--emerald);margin-bottom:4px;font-weight:600;">&#128273; Buat Password Pemilik Kas</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:16px;">Belum ada password yang diatur. Buat sekarang supaya cuma kamu (bendahara) yang bisa edit data kas ini.</p>
    <input id="setupPw1" type="password" placeholder="Password baru" style="margin-bottom:8px;">
    <input id="setupPw2" type="password" placeholder="Ulangi password" style="margin-bottom:16px;" onkeydown="if(event.key==='Enter')completeSetup()">
    <div style="display:flex;gap:8px;">
      <button class="btn btn-emerald" style="flex:1;padding:10px;" onclick="completeSetup()">Simpan Password</button>
      <button class="btn" onclick="state.showSetup=false;render()">Nanti dulu</button>
    </div>
  </div></div>`;
}
function modalLogin(){
  return `<div class="modal-overlay"><div class="modal-box" style="border:1px solid rgba(251,191,36,.3);">
    <div style="display:flex;align-items:center;gap:8px;color:var(--amber);margin-bottom:4px;font-weight:600;">&#128274; Masuk sebagai Pemilik Kas</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:16px;">Masukkan password untuk mengedit data kas.</p>
    <input id="loginPw" type="password" placeholder="Password" autofocus style="margin-bottom:16px;" onkeydown="if(event.key==='Enter')attemptLogin()">
    <div style="display:flex;gap:8px;">
      <button class="btn btn-amber" style="flex:1;padding:10px;" onclick="attemptLogin()">Masuk</button>
      <button class="btn" onclick="state.showLogin=false;render()">Batal</button>
    </div>
  </div></div>`;
}
function modalChangePw(){
  return `<div class="modal-overlay"><div class="modal-box" style="border:1px solid rgba(255,255,255,.2);">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-weight:600;">&#128273; Ganti Password Pemilik</div>
    <input id="changePw1" type="password" placeholder="Password baru" style="margin:16px 0 8px;">
    <input id="changePw2" type="password" placeholder="Ulangi password baru" style="margin-bottom:16px;" onkeydown="if(event.key==='Enter')completeChangePw()">
    <div style="display:flex;gap:8px;">
      <button class="btn btn-emerald" style="flex:1;padding:10px;" onclick="completeChangePw()">Simpan</button>
      <button class="btn" onclick="state.showChangePw=false;render()">Batal</button>
    </div>
  </div></div>`;
}

// init
state.data = loadData();
state.activeWeek = state.data.weeks[state.data.weeks.length-1]?.id;
if(!localStorage.getItem(PW_KEY)) state.showSetup = true;
render();
</script>

<div id="toast" class="toast" style="display:none;"></div>
</body>
</html>
