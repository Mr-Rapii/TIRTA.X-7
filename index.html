  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#222;border-radius:8px;}

const DAYS = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const MONTHS = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function formatID(dateStr){
  if(!dateStr) return "-";
  const d = new Date(dateStr+"T00:00:00");
  if(isNaN(d)) return dateStr;
  return DAYS[d.getDay()]+", "+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
}
function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime()-off*60000).toISOString().slice(0,10);
}
function rupiah(n){ return "Rp"+n.toLocaleString("id-ID"); }
function simpleHash(str){
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){
    const ch=str.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761);
    h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function formatDateTimeID(iso){
  const d = new Date(iso);
  if(isNaN(d)) return "-";
  const dateStr = DAYS[d.getDay()]+", "+d.getDate()+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return dateStr+" &middot; "+hh+":"+mm;
}
function defaultData(){
  return { weeks:[{id:"w-"+Date.now(), label:"Minggu 1", date:todayISO()}], payments:{}, expenses:[], activityLog:[] };
}
function pushLog(text){
  const logs = (state.data.activityLog || []).slice(-199);
  logs.push({text: text, time: new Date().toISOString()});
  return logs;
}

// ---------- statistik & analitik ----------
function studentPaidWeeks(idx){
  return state.data.weeks.filter(function(w){ return state.data.payments[idx] && state.data.payments[idx][w.id] && state.data.payments[idx][w.id].paid; });
}
function streakWeeks(idx){
  let streak = 0;
  for(let i=state.data.weeks.length-1;i>=0;i--){
    const w = state.data.weeks[i];
    const rec = state.data.payments[idx] ? state.data.payments[idx][w.id] : null;
    if(rec && rec.paid) streak++; else break;
  }
  return streak;
}
function tunggakanNominal(idx){
  const total = state.data.weeks.length;
  const paid = studentPaidWeeks(idx).length;
  return (total-paid)*WEEK_AMOUNT;
}
function avgLateDays(idx){
  const paidWeeks = state.data.weeks.filter(function(w){
    return state.data.payments[idx] && state.data.payments[idx][w.id] && state.data.payments[idx][w.id].paid;
  });
  if(paidWeeks.length===0) return null;
  let totalDelay = 0, count = 0;
  paidWeeks.forEach(function(w){
    const rec = state.data.payments[idx][w.id];
    if(!rec.date) return;
    const dueDate = new Date(w.date+"T00:00:00");
    const paidDate = new Date(rec.date+"T00:00:00");
    const delayDays = Math.round((paidDate-dueDate)/86400000);
    totalDelay += Math.max(0, delayDays);
    count++;
  });
  if(count===0) return null;
  return Math.round((totalDelay/count)*10)/10;
}
function weekFridayDate(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const day = d.getDay();
  const diffToFriday = day<=5 ? (5-day) : -1; // kalau Sabtu, anggap Jumat sebelumnya
  const f = new Date(d.getTime());
  f.setDate(d.getDate()+diffToFriday);
  return f;
}
function daysUntilDeadline(dateStr){
  const friday = weekFridayDate(dateStr);
  const today = new Date(todayISO()+"T00:00:00");
  return Math.round((friday-today)/86400000);
}
function saldoSeries(){
  let cumIncome = 0, cumExpense = 0;
  const sortedExpenses = state.data.expenses.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  let expIdx = 0;
  return state.data.weeks.map(function(w){
    cumIncome += STUDENTS.filter(function(_,i){ return state.data.payments[i] && state.data.payments[i][w.id] && state.data.payments[i][w.id].paid; }).length * WEEK_AMOUNT;
    while(expIdx<sortedExpenses.length && sortedExpenses[expIdx].date<=w.date){
      cumExpense += sortedExpenses[expIdx].amount;
      expIdx++;
    }
    return { label:w.label, saldo: cumIncome-cumExpense };
  });
}

let state = {
  data: null,
  tab: "mingguan",
  activeWeek: null,
  expanded: null,
  ownerUnlocked: false,
  showLogin: false,
  selectedStudent: null,
  showChangePw: false,

  connStatus: "menyambungkan...",
  showEditDate: false,
  editingWeekId: null,
  showStudentCard: false,
  viewStudentIdx: null,
  showImageGen: false,
  imageGenWeekId: null,
  imageGenShowSaldo: true,
};
let toastTimer = null;
let currentPwHash = null;
let db, dataRef, authRef;

function isConfigFilled(){
  return firebaseConfig.apiKey.indexOf("GANTI")===-1 && firebaseConfig.projectId.indexOf("GANTI")===-1;
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display="none"; }, 2400);
}
function requireOwner(fn){
  if(!state.ownerUnlocked){ showToast("Masuk sebagai pemilik kas dulu untuk edit."); state.showLogin = true; render(); return; }
  fn();
}

// ---------- Firestore init ----------
function initFirebase(){
  if(!isConfigFilled()){ state.configMissing = true; render(); return; }
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    dataRef = db.collection("kasX7").doc("data");
    authRef = db.collection("kasX7").doc("auth");

    dataRef.onSnapshot(function(snap){
      state.connStatus = "tersambung";
      if(snap.exists){
        state.data = snap.data();
      } else {
        state.data = defaultData();
        dataRef.set(state.data);
      }
      if(!state.activeWeek || !state.data.weeks.find(w=>w.id===state.activeWeek)){
        state.activeWeek = state.data.weeks[state.data.weeks.length-1]?.id;
      }
      render();
    }, function(err){
      state.connStatus = "gagal tersambung";
      showToast("Gagal tersambung ke Firestore. Cek config & rules.");
      render();
    });

    authRef.get().then(function(snap){
      if(snap.exists && snap.data().pwHash){
        currentPwHash = snap.data().pwHash;
      } else {
        // belum pernah diset -> langsung isi otomatis, tidak nunggu siapapun setup
        currentPwHash = PRESET_PW_HASH;
        authRef.set({pwHash: PRESET_PW_HASH}).catch(function(){});
      }
      render();
    }).catch(function(){
      currentPwHash = PRESET_PW_HASH;
      render();
    });
  }catch(e){
    state.configMissing = true;
    render();
  }
}

function saveData(next){
  const prev = state.data;
  state.data = next;
  render();
  if(dataRef){
    dataRef.set(next).catch(function(err){
      console.error("Gagal menyimpan ke Firestore:", err);
      // Tulis ke server gagal (mis. Firestore Rules menolak/expired) -> balikin state lokal
      // supaya tidak keliatan "kesimpen" padahal sebenarnya nggak, lalu balik lagi ke tampilan lama.
      state.data = prev;
      render();
      showToast("Gagal menyimpan (" + (err && err.code ? err.code : "error") + "). Cek Firestore Rules/koneksi.");
    });
  }
}

// ---------- actions ----------
function setTab(t){ state.tab = t; state.expanded = null; render(); }
function selectWeek(id){ state.activeWeek = id; render(); }
function toggleExpand(idx){ state.expanded = state.expanded===idx ? null : idx; render(); }

function addWeek(){
  requireOwner(function(){
    const w = { id:"w-"+Date.now(), label:"Minggu "+(state.data.weeks.length+1), date: todayISO() };
    const next = Object.assign({}, state.data, { weeks:[...state.data.weeks, w] });
    state.activeWeek = w.id;
    saveData(next); showToast(w.label+" ditambahkan");
  });
}
function deleteWeek(weekId){
  requireOwner(function(){
    if(state.data.weeks.length<=1){ showToast("Minimal harus ada 1 minggu."); return; }
    const weeks = state.data.weeks.filter(w=>w.id!==weekId);
    const payments = {};
    Object.keys(state.data.payments).forEach(function(sIdx){
      const wp = Object.assign({}, state.data.payments[sIdx]);
      delete wp[weekId];
      payments[sIdx]=wp;
    });
    if(state.activeWeek===weekId) state.activeWeek = weeks[weeks.length-1]?.id;
    saveData(Object.assign({}, state.data, {weeks, payments}));
  });
}
function togglePayment(studentIdx, weekId){
  requireOwner(function(){
    const cur = (state.data.payments[studentIdx]||{})[weekId];
    const isPaid = cur && cur.paid;
    const payments = Object.assign({}, state.data.payments);
    payments[studentIdx] = Object.assign({}, payments[studentIdx]);
    payments[studentIdx][weekId] = isPaid ? null : {paid:true, date: todayISO()};
    saveData(Object.assign({}, state.data, {payments}));
  });
}
function openEditWeekDate(weekId){

function saveWeekDate(){

  if(day===0 || day===6){ showToast("Tanggal harus hari Senin–Jumat (hari sekolah)."); return; }
  const weeks = state.data.weeks.map(function(w){ return w.id===state.editingWeekId ? Object.assign({}, w, {date: val}) : w; });
  saveData(Object.assign({}, state.data, {weeks: weeks}));
  state.showEditDate = false;
  showToast("Tanggal berhasil diubah.");
  render();

function addExpense(){

}
function deleteExpense(id){

    saveData(Object.assign({}, state.data, {expenses: state.data.expenses.filter(e=>e.id!==id)}));

function exportBackup(){
  requireOwner(function(){
    const blob = new Blob([JSON.stringify(state.data,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "kas-x7-backup-"+todayISO()+".json";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showToast("File backup diunduh.");
  });
}
function importBackupFile(input){
  requireOwner(function(){
    const file = input.files && input.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(){
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.weeks || !parsed.payments) throw new Error("format tidak valid");
        const next = {weeks:parsed.weeks, payments:parsed.payments, expenses:parsed.expenses||[]};
        state.activeWeek = next.weeks[next.weeks.length-1]?.id;
        saveData(next);
        showToast("Data berhasil dipulihkan & disinkronkan ke server.");
      }catch(e){ showToast("File backup tidak valid."); }
    };
    reader.readAsText(file);
    input.value = "";
  });
}

    state.showChangePw = false;
    showToast("Password berhasil diganti.");

function generateRecapText(week){
  const paidList = [];
  const unpaidList = [];
  STUDENTS.forEach(function(name, idx){
    const rec = state.data.payments[idx] ? state.data.payments[idx][week.id] : null;
    if(rec && rec.paid) paidList.push(name); else unpaidList.push(name);
  });
  let txt = "*KAS KELAS X-7 · GUGUS TIRTA*\n";
  txt += week.label + " (" + formatID(week.date) + ")\n";
  txt += "Iuran: " + rupiah(WEEK_AMOUNT) + "/minggu\n\n";
  txt += "✅ SUDAH BAYAR (" + paidList.length + ")\n";
  txt += paidList.length===0 ? "- belum ada -\n" : paidList.map(function(n,i){ return (i+1)+". "+n; }).join("\n")+"\n";
  txt += "\n❌ BELUM BAYAR (" + unpaidList.length + ")\n";
  txt += unpaidList.length===0 ? "- lunas semua -\n" : unpaidList.map(function(n,i){ return (i+1)+". "+n; }).join("\n")+"\n";
  return txt;
}
function copyRecapText(weekId){
  const week = state.data.weeks.find(function(w){ return w.id===weekId; });
  if(!week) return;
  const txt = generateRecapText(week);
  function fallbackCopy(){
    const ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try{ document.execCommand("copy"); showToast("Rekap disalin, siap ditempel ke grup."); }
    catch(e){ showToast("Gagal menyalin. Salin manual ya."); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){
      showToast("Rekap disalin, siap ditempel ke grup.");
    }).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}
function filterStudents(query){

function renderCountdownCard(){
  if(!state.data.weeks.length) return "";
  const latest = state.data.weeks[state.data.weeks.length-1];
  const daysLeft = daysUntilDeadline(latest.date);
  let color = "var(--emerald)", border = "rgba(52,211,153,.2)", pulseClass = "", label, big;
  if(daysLeft < 0){
    color = "var(--faint)"; border = "rgba(255,255,255,.08)";
    label = "Tenggat " + latest.label + " sudah lewat"; big = Math.abs(daysLeft) + " hari lalu";
  } else if(daysLeft === 0){
    color = "var(--red)"; border = "rgba(248,113,113,.35)"; pulseClass = "pulse-danger";
    label = "Hari ini tenggat " + latest.label + "!"; big = "Hari H";
  } else if(daysLeft === 1){
    color = "var(--amber)"; border = "rgba(251,191,36,.35)"; pulseClass = "pulse-warn";
    label = "Besok tenggat " + latest.label; big = "1 hari lagi";
  } else {
    label = "Tenggat " + latest.label; big = daysLeft + " hari lagi";
  }
  return `<div class="card fade-in ${pulseClass}" style="padding:20px;border-color:${border};animation-delay:.2s;">
    <div class="mono" style="font-size:11px;text-transform:uppercase;color:${color};margin-bottom:8px;">&#9203; Countdown Setoran</div>
    <div class="count-num" style="font-size:22px;font-weight:600;color:${color};">${big}</div>
    <div class="mono" style="font-size:10px;color:var(--faint);margin-top:4px;">${label}</div>
  </div>`;
}

function computeTotals(){
  let totalMasuk = 0;
  state.data.weeks.forEach(function(w){
    STUDENTS.forEach(function(_,i){ if(state.data.payments[i] && state.data.payments[i][w.id] && state.data.payments[i][w.id].paid) totalMasuk += WEEK_AMOUNT; });
  });
  const totalKeluar = state.data.expenses.reduce(function(s,e){return s+e.amount;},0);
  return { totalMasuk: totalMasuk, totalKeluar: totalKeluar, saldo: totalMasuk-totalKeluar };
}

function renderSaldoChart(){
  const series = saldoSeries();
  if(series.length<2) return "";
  const W = 560, H = 130, padX = 24, padY = 18;
  const values = series.map(function(s){return s.saldo;});
  const maxV = Math.max.apply(null, values.concat([0]));
  const minV = Math.min.apply(null, values.concat([0]));
  const range = (maxV-minV) || 1;
  const stepX = (W-padX*2)/(series.length-1);
  const points = series.map(function(s,i){
    const x = padX + i*stepX;
    const y = H-padY - ((s.saldo-minV)/range)*(H-padY*2);
    return {x:x, y:y, saldo:s.saldo, label:s.label};
  });
  const pathD = points.map(function(p,i){ return (i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1); }).join(" ");
  let html = `<div class="card fade-in" style="padding:16px;margin-bottom:20px;animation-delay:.1s;">
    <div style="font-size:13px;font-weight:600;margin-bottom:10px;">&#128201; Grafik Saldo Kas dari Waktu ke Waktu</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:130px;overflow:visible;">
      <line x1="${padX}" y1="${H-padY}" x2="${W-padX}" y2="${H-padY}" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
      <path class="line-path" d="${pathD}" fill="none" stroke="var(--emerald)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  points.forEach(function(p,i){
    html += `<circle class="dot-pop" style="animation-delay:${.9+i*.05}s;" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#05070a" stroke="var(--emerald)" stroke-width="2"/>`;
  });
  html += `</svg>
    <div style="display:flex;justify-content:space-between;margin-top:4px;">
      ${points.map(function(p){ return `<span class="mono" style="font-size:9px;color:var(--faint);">${p.label.replace('Minggu ','M')}</span>`; }).join("")}
    </div>
    <div class="mono" style="font-size:11px;color:var(--muted);margin-top:6px;">Saldo terakhir: <span style="color:var(--emerald);">${rupiah(values[values.length-1])}</span></div>
  </div>`;
  return html;
}

function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawStoryImage(){
  const canvas = document.getElementById("storyCanvas");
  if(!canvas) return;
  const week = state.data.weeks.find(function(w){ return w.id===state.imageGenWeekId; });
  if(!week) return;
  const showSaldo = state.imageGenShowSaldo;
  const W = 1080;
  const cols = 2, colGap = 32, rowH = 50;
  const rows = Math.ceil(STUDENTS.length/cols);
  const listH = rows*rowH;
  let H = 260 + 190 + (showSaldo?190:0) + 70 + listH + 90;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  // background
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#070a0f"); bg.addColorStop(1,"#0a0e14");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // subtle grid
  ctx.strokeStyle = "rgba(52,211,153,0.05)"; ctx.lineWidth = 1;
  for(let x=0;x<W;x+=54){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for(let y=0;y<H;y+=54){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

  // glow blobs
  function blob(x,y,r,color){
    const g = ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,color); g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  blob(W-120,140,380,"rgba(52,211,153,0.22)");
  blob(120,H-140,380,"rgba(251,191,36,0.18)");

  // header
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(251,191,36,0.9)";
  ctx.font = "600 26px 'JetBrains Mono', monospace";
  ctx.fillText("K E L A S   X - 7   ·   G U G U S   T I R T A", W/2, 90);
  ctx.fillStyle = "#f2f2f2";
  ctx.font = "700 66px 'Space Grotesk', sans-serif";
  ctx.fillText("KAS KELAS", W/2, 165);
  ctx.font = "500 30px 'Space Grotesk', sans-serif";
  ctx.fillStyle = "#a3a3a3";
  ctx.fillText(week.label+" · "+formatID(week.date), W/2, 210);

  let y = 260;

  // top rajin spotlight
  const rowsData = STUDENTS.map(function(name,idx){
    return { name:name, idx:idx, paid: studentPaidWeeks(idx).length, streak: streakWeeks(idx) };
  });
  const topRajin = rowsData.slice().sort(function(a,b){ return b.streak-a.streak || b.paid-a.paid || a.name.localeCompare(b.name); })[0];

  roundRectPath(ctx,60,y,W-120,150,26);
  ctx.fillStyle = "rgba(52,211,153,0.09)"; ctx.fill();
  ctx.strokeStyle = "rgba(52,211,153,0.45)"; ctx.lineWidth = 2; ctx.stroke();
  ctx.textAlign = "left";
  ctx.font = "600 24px 'JetBrains Mono', monospace";
  ctx.fillStyle = "#34d399";
  ctx.fillText("\uD83C\uDFC6 PALING RAJIN BAYAR", 96, y+46);
  ctx.font = "700 44px 'Space Grotesk', sans-serif";
  ctx.fillStyle = "#f2f2f2";
  ctx.fillText(topRajin.name, 96, y+96);
  ctx.font = "500 22px 'JetBrains Mono', monospace";
  ctx.fillStyle = "#a3a3a3";
  const subLine = (topRajin.streak>0 ? "\uD83D\uDD25 "+topRajin.streak+" minggu beruntun  ·  " : "")+topRajin.paid+"/"+state.data.weeks.length+" minggu lunas";
  ctx.fillText(subLine, 96, y+132);
  y += 190;

  // saldo section (toggleable)
  if(showSaldo){
    const totals = computeTotals();
    roundRectPath(ctx,60,y,W-120,150,26);
    const cardBg = ctx.createLinearGradient(60,y,W-60,y+150);
    cardBg.addColorStop(0,"rgba(52,211,153,0.12)"); cardBg.addColorStop(1,"rgba(251,191,36,0.12)");
    ctx.fillStyle = cardBg; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = 1.5; ctx.stroke();

    const colW = (W-120)/3;
    function statCol(cx, label, value, color){
      ctx.textAlign = "center";
      ctx.font = "600 18px 'JetBrains Mono', monospace";
      ctx.fillStyle = color;
      ctx.fillText(label, cx, y+50);
      ctx.font = "700 30px 'Space Grotesk', sans-serif";
      ctx.fillStyle = "#f2f2f2";
      ctx.fillText(rupiah(value), cx, y+95);
    }
    statCol(60+colW*0.5, "MASUK", totals.totalMasuk, "#34d399");
    statCol(60+colW*1.5, "KELUAR", totals.totalKeluar, "#fbbf24");
    statCol(60+colW*2.5, "SALDO SAAT INI", totals.saldo, "#f2f2f2");
    y += 190;
  }

  // list header
  ctx.textAlign = "left";
  ctx.font = "600 24px 'JetBrains Mono', monospace";
  ctx.fillStyle = "#e5e5e5";
  ctx.fillText("\uD83D\uDCCB STATUS SETORAN \u2014 "+week.label, 60, y+16);
  y += 60;

  const colWidth = (W-120-colGap)/cols;
  STUDENTS.forEach(function(name, idx){
    const col = idx % cols;
    const row = Math.floor(idx/cols);
    const x = 60 + col*(colWidth+colGap);
    const yy = y + row*rowH;
    const rec = state.data.payments[idx] ? state.data.payments[idx][week.id] : null;
    const paid = rec && rec.paid;
    roundRectPath(ctx, x, yy, colWidth, rowH-10, 10);
    ctx.fillStyle = paid ? "rgba(52,211,153,0.10)" : "rgba(248,113,113,0.10)";
    ctx.fill();
    ctx.textAlign = "left";
    ctx.font = "500 19px 'Space Grotesk', sans-serif";
    ctx.fillStyle = "#e5e5e5";
    let displayName = name.length>24 ? name.slice(0,22)+"\u2026" : name;
    ctx.fillText((idx+1)+". "+displayName, x+14, yy+(rowH-10)/2+7);
    ctx.textAlign = "right";
    ctx.font = "700 19px 'JetBrains Mono', monospace";
    ctx.fillStyle = paid ? "#34d399" : "#f87171";
    ctx.fillText(paid ? "\u2713" : "\u2717", x+colWidth-14, yy+(rowH-10)/2+7);
  });
  y += rows*rowH + 20;

  // footer
  ctx.textAlign = "center";
  ctx.font = "500 18px 'JetBrains Mono', monospace";
  ctx.fillStyle = "#525252";
  ctx.fillText("dibuat otomatis dari Kas Kelas X-7 \u00b7 "+formatID(todayISO()), W/2, y+30);
}

function selectSingleStudent(val){
  state.selectedStudent = val===""? null : parseInt(val,10);
  render();
}

function studentCardHTML(idx){
  const name = STUDENTS[idx];
  const paidWeeks = state.data.weeks.filter(function(w){ return state.data.payments[idx] && state.data.payments[idx][w.id] && state.data.payments[idx][w.id].paid; });
  const unpaidWeeks = state.data.weeks.filter(function(w){ return !(state.data.payments[idx] && state.data.payments[idx][w.id] && state.data.payments[idx][w.id].paid); });
  const tunggakan = tunggakanNominal(idx);
  const avgLate = avgLateDays(idx);
  const streak = streakWeeks(idx);
  return `<div class="card fade-in" style="padding:20px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
      <span class="mono" style="font-size:12px;color:var(--faint);">#${idx+1}</span>
      <div style="font-size:18px;font-weight:600;">${name}</div>
      ${isTreasurer(name) ? `<span class="mono" style="font-size:10px;color:var(--emerald);background:var(--emerald-soft);border:1px solid var(--emerald-border);border-radius:6px;padding:2px 6px;">&#128176; Bendahara</span>` : ''}
      ${streak>=2 ? `<span class="mono" style="font-size:10px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-border);border-radius:6px;padding:2px 6px;">&#128293; ${streak} minggu beruntun</span>` : ''}
    </div>
    <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
      <span class="mono" style="font-size:12px;color:var(--emerald);">&#10003; ${paidWeeks.length} minggu lunas</span>
      <span class="mono" style="font-size:12px;color:var(--amber);">&#10007; ${unpaidWeeks.length} minggu belum</span>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;">
      <span class="mono" style="font-size:11px;color:${tunggakan>0?'var(--red)':'var(--muted)'};">&#128181; Tunggakan: ${tunggakan>0?rupiah(tunggakan):'Lunas semua'}</span>
      <span class="mono" style="font-size:11px;color:var(--muted);">&#8987; Rata-rata telat: ${avgLate===null?'-':avgLate+' hari'}</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div>
        <div class="mono" style="font-size:11px;text-transform:uppercase;color:var(--emerald);margin-bottom:8px;">Sudah Bayar</div>
        ${paidWeeks.length===0 ? `<div style="font-size:12px;color:var(--faint);">- belum ada -</div>` :
          `<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;">` +
          paidWeeks.map(function(w){ return `<li style="font-size:12px;display:flex;justify-content:space-between;gap:8px;"><span>${w.label}</span><span class="mono" style="color:var(--muted);">${formatID(state.data.payments[idx][w.id].date)}</span></li>`; }).join("") +
          `</ul>`}
      </div>
      <div>
        <div class="mono" style="font-size:11px;text-transform:uppercase;color:var(--amber);margin-bottom:8px;">Belum Bayar</div>
        ${unpaidWeeks.length===0 ? `<div style="font-size:12px;color:var(--faint);">- lunas semua -</div>` :
          `<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;">` +
          unpaidWeeks.map(function(w){ return `<li style="font-size:12px;display:flex;justify-content:space-between;gap:8px;"><span>${w.label}</span><span class="mono" style="color:var(--muted);">${formatID(w.date)}</span></li>`; }).join("") +
          `</ul>`}
      </div>
    </div>
  </div>`;
}

function renderStatistik(){
  const total = state.data.weeks.length;
  if(total===0) return "";
  const rows = STUDENTS.map(function(name, idx){
    const paid = studentPaidWeeks(idx).length;
    return { idx:idx, name:name, paid:paid, unpaid: total-paid, tunggakan: tunggakanNominal(idx), avgLate: avgLateDays(idx), streak: streakWeeks(idx) };
  });
  const rajin = rows.slice().sort(function(a,b){ return b.paid-a.paid || a.name.localeCompare(b.name); }).slice(0,5);
  const nunggak = rows.slice().filter(function(r){return r.unpaid>0;}).sort(function(a,b){ return b.tunggakan-a.tunggakan || a.name.localeCompare(b.name); }).slice(0,5);
  const telat = rows.slice().filter(function(r){return r.avgLate!==null && r.avgLate>0;}).sort(function(a,b){ return b.avgLate-a.avgLate; }).slice(0,5);
  const streakTop = rows.slice().filter(function(r){return r.streak>0;}).sort(function(a,b){ return b.streak-a.streak || a.name.localeCompare(b.name); }).slice(0,5);

  function miniList(title, color, icon, items, renderRight){
    return `<div class="card fade-in" style="padding:14px 16px;">
      <div style="font-size:12px;font-weight:600;color:${color};margin-bottom:10px;">${icon} ${title}</div>` +
      (items.length===0 ? `<div style="font-size:12px;color:var(--faint);">Belum ada data.</div>` :
        items.map(function(r,i){ return `<div style="display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:4px 0;"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${i+1}. ${r.name}</span><span class="mono" style="color:${color};flex-shrink:0;">${renderRight(r)}</span></div>`; }).join("")) +
      `</div>`;
  }

  let html = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:20px;">`;
  html += miniList("Paling Rajin Bayar", "var(--emerald)", "&#127942;", rajin, function(r){ return r.paid+"/"+total; });
  html += miniList("Streak Terpanjang", "var(--amber)", "&#128293;", streakTop, function(r){ return r.streak+" minggu"; });
  html += miniList("Tunggakan Terbesar", "var(--red)", "&#9888;&#65039;", nunggak, function(r){ return rupiah(r.tunggakan); });
  html += miniList("Paling Sering Telat", "var(--amber)", "&#8987;", telat, function(r){ return r.avgLate+" hari"; });
  html += `</div>`;
  return html;
}

function renderSiswa(){
  if(!state.ownerUnlocked){
    // non-bendahara: pilih 1 siswa, cuma kartu siswa itu yang tampil
    let html = `<div style="margin-bottom:20px;">
      <label class="lbl">Pilih Nama Kamu</label>
      <select id="studentPicker" onchange="selectSingleStudent(this.value)" style="width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;">
        <option value="">-- pilih nama --</option>
        ${STUDENTS.map(function(n,i){ return `<option value="${i}" ${state.selectedStudent===i?'selected':''}>${i+1}. ${n}</option>`; }).join("")}
      </select>
    </div>`;
    if(state.selectedStudent===null){
      html += `<div class="card" style="padding:24px;text-align:center;color:var(--faint);font-size:13px;">Pilih nama kamu dulu di atas buat lihat status kas.</div>`;
    } else {
      html += studentCardHTML(state.selectedStudent);
    }
    return html;
  }

  // bendahara: semua siswa tertera lengkap
  let html = renderStatistik();
  html += `<div style="position:relative;margin-bottom:20px;">
    <input id="searchInput" type="text" placeholder="Cari nama siswa..." oninput="filterStudents(this.value)" style="padding-left:14px;">
  </div><div style="display:flex;flex-direction:column;gap:8px;">`;

  STUDENTS.forEach(function(name, idx){
    const paidWeeks = state.data.weeks.filter(function(w){ return state.data.payments[idx] && state.data.payments[idx][w.id] && state.data.payments[idx][w.id].paid; });
    const unpaidWeeks = state.data.weeks.filter(function(w){ return !(state.data.payments[idx] && state.data.payments[idx][w.id] && state.data.payments[idx][w.id].paid); });
    const isOpen = state.expanded===idx;
    html += `<div class="card" data-student-row data-name="${name.toLowerCase()}" style="overflow:hidden;">
      <button onclick="toggleExpand(${idx})" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:none;border:none;color:inherit;cursor:pointer;text-align:left;">
        <div style="display:flex;align-items:center;gap:12px;min-width:0;">
          <span class="mono" style="font-size:11px;color:var(--faint);width:22px;flex-shrink:0;">${idx+1}</span>
          <span style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${name}</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
          <span class="mono" style="font-size:11px;color:var(--emerald);">${paidWeeks.length} lunas</span>
          <span class="mono" style="font-size:11px;color:var(--amber);">${unpaidWeeks.length} belum</span>
          ${streakWeeks(idx)>=2 ? `<span class="mono" style="font-size:11px;color:var(--amber);">&#128293;${streakWeeks(idx)}</span>` : ''}
          ${unpaidWeeks.length>0 ? `<span class="mono" style="font-size:11px;color:var(--red);">${rupiah(tunggakanNominal(idx))}</span>` : ''}
          <span style="color:var(--faint);">${isOpen?'&#9650;':'&#9660;'}</span>
        </div>
      </button>`;
    if(isOpen){
      html += `<div style="padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;border-top:1px solid rgba(255,255,255,.05);padding-top:12px;">
        <div>
          <div class="mono" style="font-size:11px;text-transform:uppercase;color:var(--emerald);margin-bottom:8px;">Sudah Bayar</div>
          ${paidWeeks.length===0 ? `<div style="font-size:12px;color:var(--faint);">- belum ada -</div>` :
            `<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;">` +
            paidWeeks.map(function(w){ return `<li style="font-size:12px;display:flex;justify-content:space-between;gap:8px;"><span>${w.label}</span><span class="mono" style="color:var(--muted);">${formatID(state.data.payments[idx][w.id].date)}</span></li>`; }).join("") +
            `</ul>`}
        </div>
        <div>
          <div class="mono" style="font-size:11px;text-transform:uppercase;color:var(--amber);margin-bottom:8px;">Belum Bayar</div>
          ${unpaidWeeks.length===0 ? `<div style="font-size:12px;color:var(--faint);">- lunas semua -</div>` :
            `<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;">` +
            unpaidWeeks.map(function(w){ return `<li style="font-size:12px;display:flex;justify-content:space-between;gap:8px;"><span>${w.label}</span><span class="mono" style="color:var(--muted);">${formatID(w.date)}</span></li>`; }).join("") +
            `</ul>`}
        </div>
      </div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

function renderPengeluaran(saldo){
  let html = `<div style="display:grid;grid-template-columns:1fr;gap:24px;">`;
  html += `<div>
    <div style="font-size:14px;font-weight:600;margin-bottom:12px;">Catat Pengeluaran Baru</div>
    ${!state.ownerUnlocked ? `<div class="mono" style="font-size:12px;color:var(--amber);background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);border-radius:10px;padding:8px 12px;margin-bottom:12px;">Masuk sebagai pemilik kas untuk menambah pengeluaran.</div>` : ''}
    <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px;">
      <div><label class="lbl">Nama Barang / Keperluan</label><input id="expItem" type="text" placeholder="mis. Spidol &amp; penghapus papan tulis"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div><label class="lbl">Jumlah (Rp)</label><input id="expAmount" type="number" placeholder="0"></div>
        <div><label class="lbl">Tanggal</label><input id="expDate" type="date" value="${todayISO()}"></div>
      </div>
      <div><label class="lbl">Catatan (opsional)</label><input id="expNote" type="text" placeholder="mis. dibeli di toko ATK dekat sekolah"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span class="mono" style="font-size:11px;color:var(--muted);">Saldo saat ini: ${rupiah(saldo)}</span>
        <button class="btn btn-amber" onclick="addExpense()">&#43; Catat</button>
      </div>
    </div>
  </div>`;

  html += `<div>
    <div style="font-size:14px;font-weight:600;margin-bottom:12px;">Riwayat Pengeluaran</div>
    <div class="card" style="max-height:420px;overflow-y:auto;">`;
  if(state.data.expenses.length===0){
    html += `<div style="padding:16px;font-size:12px;color:var(--faint);">Belum ada pengeluaran tercatat.</div>`;
  }
  state.data.expenses.forEach(function(e){
    html += `<div class="row" style="align-items:flex-start;">
      <div style="min-width:0;">
        <div style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.item}</div>
        ${e.note ? `<div style="font-size:12px;color:var(--muted);">${e.note}</div>` : ''}
        <div class="mono" style="font-size:11px;color:var(--faint);margin-top:2px;">${formatID(e.date)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <span class="mono" style="font-size:14px;color:var(--amber);">-${rupiah(e.amount)}</span>
        <button onclick="deleteExpense('${e.id}')" style="background:none;border:none;color:var(--faint);cursor:pointer;">&#128465;&#65039;</button>
      </div>
    </div>`;
  });
  html += `</div></div></div>`;
  return html;
}

        <label class="btn" style="cursor:pointer;">&#11014;&#65039; Pilih File<input type="file" accept="application/json" style="display:none;" onchange="importBackupFile(this)"></label>
      </div>
    </div>
  </div>`;
}

    <input id="editWeekDateInput" type="date" value="${week.date}" style="margin-bottom:16px;" onkeydown="if(event.key==='Enter')saveWeekDate()">
    <div style="display:flex;gap:8px;">
      <button class="btn btn-emerald" style="flex:1;padding:10px;" onclick="saveWeekDate()">Simpan</button>
      <button class="btn" onclick="state.showEditDate=false;render()">Batal</button>
    </div>

}
function modalStudentCard(){
  const idx = state.viewStudentIdx;
  if(idx===null || idx===undefined) return "";
  return `<div class="modal-overlay" onclick="if(event.target===this)closeStudentCard()">
    <div style="max-width:420px;width:100%;position:relative;">
      <button onclick="closeStudentCard()" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);border:none;color:var(--text);font-size:16px;line-height:28px;text-align:center;cursor:pointer;width:28px;height:28px;border-radius:50%;z-index:2;">&times;</button>
      ${studentCardHTML(idx)}
    </div>
  </div>`;
}

render();
initFirebase();
